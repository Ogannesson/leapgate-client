[package]
name = "leapgate"
version = "0.4.0"
edition = "2021"
description = "Leapgate extensions to the RustDesk engine"

[dependencies]
hbb_common = { path = "../hbb_common" }
base = { path = "../base" }
# No default features: 0.12's defaults pull in h2 and encoding_rs, which the lock file does not
# have. The root crate already enables these.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "socks"] }
serde = { version = "1.0", features = ["derive"] }
stun_codec = "0.3"
# define_attribute_enums! expands to ::bytecodec paths, and stun_codec does not re-export it.
bytecodec = "0.4"
cidr-utils = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
