# Leapgate new UI, core package: the bridge, models, sessions and state; no pages.
# It keeps upstream's package name so files copied from flutter/lib import unchanged
# (docs/新界面/03-实施方案.md §1.1). Dependencies follow flutter/pubspec.yaml.
name: flutter_hbb
description: Leapgate UI core (bridge, models, state).
publish_to: none

environment:
  sdk: '^3.1.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.1
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.0
  win32: any
  flutter_rust_bridge: "1.80.1"
  freezed_annotation: ^2.0.3
  meta: any
  uuid: ^3.0.7
  # Same forks and refs as flutter/pubspec.yaml: the Rust core loads the two texture plugins by
  # dll name and C symbol (docs/新界面/03-实施方案.md §1.6).
  texture_rgba_renderer:
    git:
      url: https://github.com/rustdesk-org/flutter_texture_rgba_renderer
      ref: 42797e0f03141dc2b585f76c64a13974508058b4
  flutter_gpu_texture_renderer:
    git:
      url: https://github.com/rustdesk-org/flutter_gpu_texture_renderer
      ref: 08a471bb8ceccdd50483c81cdfa8b81b07b14b87
  flutter_custom_cursor:
    git:
      url: https://github.com/rustdesk-org/flutter_custom_cursor
      ref: db63b785c38153603e9fb84b50d3ec46f0d7e05e

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^2.0.2
  build_runner: ^2.4.6
  freezed: ^2.4.2
  ffigen: ^8.0.2
