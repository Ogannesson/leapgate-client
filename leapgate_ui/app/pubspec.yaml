# Leapgate new UI, app package: pages, components, tokens and the Windows runner
# (docs/新界面/03-实施方案.md §1.1). The product version comes from libs/leapgate through
# `flutter build --build-name` (scripts/windows/build-client.ps1 -Ui leapgate).
name: leapgate_ui
description: Leapgate desktop UI.
publish_to: none

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_hbb:
    path: ../core
  # Same fork and ref as flutter/pubspec.yaml (docs/新界面/03-实施方案.md §1.6)
  window_manager:
    git:
      url: https://github.com/rustdesk-org/window_manager
      ref: cf4aef0512092fad9344a27ffe1c47ad83269dfc
  # The Rust core hands links to the main window as WM_USER + 2, which uni_links_desktop reads
  uni_links:
    git:
      url: https://github.com/rustdesk-org/uni_links
      path: uni_links
      ref: f416118d843a7e9ed117c7bb7bdc2deda5a9e86f
  uni_links_desktop: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
